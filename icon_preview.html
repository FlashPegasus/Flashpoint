<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashPoint Icon Preview</title>
    <style>
        body {
            background: #0f1115;
            color: white;
            font-family: sans-serif;
            padding: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }

        .icon-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
        }

        svg {
            width: 64px;
            height: 64px;
            margin-bottom: 10px;
            color: #a855f7;
        }

        p {
            margin: 0;
            font-size: 12px;
            font-weight: bold;
            color: #94a3b8;
        }
    </style>
</head>

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Organize e gerencie seus torneios de TCG, Commander e muito mais com o FlashPoint." />
  <meta name="theme-color" content="#8b5cf6" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://flashpoint-anti.web.app/" />
  <meta property="og:title" content="FlashPoint - Gestão de Torneios" />
  <meta property="og:description"
    content="A plataforma definitiva para organizadores e jogadores de Magic, Pokémon e outros TCGs." />
  <meta property="og:image" content="https://flashpoint-anti.web.app/banner-og.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://flashpoint-anti.web.app/" />
  <meta property="twitter:title" content="FlashPoint - Gestão de Torneios" />
  <meta property="twitter:description"
    content="A plataforma definitiva para organizadores e jogadores de Magic, Pokémon e outros TCGs." />
  <meta property="twitter:image" content="https://flashpoint-anti.web.app/banner-og.png" />

  <title>FlashPoint - Gestão de Torneios</title>
  
  <script>
    (function() {
      const theme = localStorage.getItem('flashpoint-theme');
      if (theme) {
        document.documentElement.classList.add(theme);
      }
    })();
  </script>

  <!-- Google Fonts: Cinzel Decorative (landing hero) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
